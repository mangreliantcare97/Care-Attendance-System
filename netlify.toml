[build]
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://care-attendance-system.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/checkin.html"
  status = 200
  force = true

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
