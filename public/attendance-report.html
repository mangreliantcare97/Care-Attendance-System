<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" data-theme-color>
    <script src="/js/theme.js"></script>
    <title>Attendance Reports | Care Attendance</title>
    <link rel="icon" type="image/x-icon" href="/assets/img/hr_logo.png">

    <link rel="stylesheet" href="/css/source-sans-pro.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/vendor/adminlte.min.css">
    <link rel="stylesheet" href="/vendor/toastr/toastr.min.css">
    <link rel="stylesheet" href="/css/theme.css">

</head>
<body class="hold-transition sidebar-mini layout-fixed" data-page="attendance-report">
    <div class="wrapper">
        <div id="navbar-placeholder"></div>
        <div id="sidebar-placeholder"></div>

        <div class="content-wrapper">
            <section class="content">
                <div class="container-fluid">
                    <div class="content-header">
                        <div class="row mb-2">
                            <div class="col-sm-6">
                                <h1 class="m-0">Attendance Reports</h1>
                            </div>
                            <div class="col-sm-6 text-right no-print">
                                <button type="button" class="btn btn-secondary" id="print-report">
                                    <i class="fa fa-print"></i> Print
                                </button>
                                <button type="button" class="btn btn-success" id="export-csv">
                                    <i class="fa fa-file-csv"></i> Export CSV
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Filters -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card card-glass no-print">
                                <div class="card-header">
                                    <h3 class="card-title">Filters</h3>
                                </div>
                                <div class="card-body">
                                    <form id="filter-form">
                                        <div class="row">
                                            <div class="form-group col-md-3">
                                                <label for="filter-from">From</label>
                                                <input type="date" class="form-control" id="filter-from">
                                            </div>
                                            <div class="form-group col-md-3">
                                                <label for="filter-to">To</label>
                                                <input type="date" class="form-control" id="filter-to">
                                            </div>
                                            <div class="form-group col-md-2">
                                                <label for="filter-department">Department</label>
                                                <select class="custom-select" id="filter-department">
                                                    <option value="">All departments</option>
                                                </select>
                                            </div>
                                            <div class="form-group col-md-2">
                                                <label for="filter-employee">Employee</label>
                                                <select class="custom-select" id="filter-employee">
                                                    <option value="">All employees</option>
                                                </select>
                                            </div>
                                            <div class="form-group col-md-2 d-flex align-items-end">
                                                <button class="btn btn-primary mr-2" type="submit">Filter</button>
                                                <button class="btn btn-success" type="reset" id="reset-filters">Reset</button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Counts -->
                    <div class="row">
                        <div class="col-12">
                            <div class="row" id="report-counts"></div>
                        </div>
                    </div>

                    <!-- Table -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card card-glass">
                                <div class="card-header">
                                    <h3 class="card-title">Records</h3>
                                </div>
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-striped">
                                            <thead>
                                                <tr>
                                                    <th>Date</th>
                                                    <th>Employee</th>
                                                    <th>Department</th>
                                                    <th>Position</th>
                                                    <th>Status</th>
                                                    <th>Check in</th>
                                                    <th>Check out</th>
                                                    <th>Note</th>
                                                    <th class="no-print">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody id="report-body">
                                                <tr><td colspan="9" class="text-center py-4">Loading…</td></tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="card-footer d-flex justify-content-between align-items-center">
                                    <span class="text-muted" id="report-count"></span>
                                    <div id="report-pagination"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="main-footer">
            <strong>Care Attendance</strong>
            <div class="float-right d-none d-sm-inline">Signed in as <span data-admin-name>Administrator</span></div>
        </footer>
    </div>

    <!-- Edit an attendance record -->
    <div class="modal fade" id="record-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="record-modal-title">Edit attendance</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form id="record-form">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="record-status">Status</label>
                            <select class="custom-select" id="record-status" name="status" required>
                                <option value="present">Present</option>
                                <option value="late">Late</option>
                                <option value="absent">Absent</option>
                                <option value="on_leave">On leave</option>
                                <option value="vacation">Vacation</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="form-group col-6">
                                <label for="record-check-in">Check in</label>
                                <input type="time" class="form-control" id="record-check-in" name="checkIn">
                            </div>
                            <div class="form-group col-6">
                                <label for="record-check-out">Check out</label>
                                <input type="time" class="form-control" id="record-check-out" name="checkOut">
                            </div>
                        </div>
                        <div class="form-group mb-0">
                            <label for="record-note">Note</label>
                            <textarea class="form-control" id="record-note" name="note" rows="3" maxlength="500"></textarea>
                            <small class="form-text text-muted">Leave the times empty when they do not apply.</small>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="record-save">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/vendor/jquery.min.js"></script>
    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/vendor/toastr/toastr.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/dom.js"></script>
    <script src="/js/fullscreen.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/attendance-report.js"></script>
</body>
</html>
