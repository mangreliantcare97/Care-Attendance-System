<!-- Shared glass header — injected by /js/layout.js -->
<header class="glass-header">
    <div class="glass-header__greeting">
        <a class="glass-avatar-link" href="/my-account.html" aria-label="My account" title="My account">
            <img class="glass-avatar" src="/assets/img/admin.jpg" alt="" width="46" height="46" loading="lazy" decoding="async">
        </a>
        <div>
            <p class="glass-greeting__eyebrow" id="dashboard-greeting">Welcome back</p>
            <h1 class="glass-greeting__title">
                <span data-admin-name>Administrator</span>
            </h1>
            <p class="glass-greeting__meta">Today is <span id="summary-date">—</span></p>
        </div>
    </div>

    <div class="glass-search" role="search">
        <i class="fas fa-search" aria-hidden="true"></i>
        <input id="dashboard-search" type="search" placeholder="Search this page…" aria-label="Search this page">
    </div>

    <div class="glass-header__actions">
        <button type="button" class="glass-icon-btn" data-theme-toggle aria-label="Switch theme" aria-pressed="false">
            <i class="fa fa-moon" aria-hidden="true"></i>
        </button>
        <a class="glass-icon-btn" href="/calendar.html" aria-label="Calendar" title="Calendar">
            <i class="fa fa-calendar-alt" aria-hidden="true"></i>
        </a>
        <button type="button" class="glass-icon-btn" data-fullscreen-toggle aria-label="Full screen" aria-pressed="false">
            <i class="fas fa-expand-arrows-alt" aria-hidden="true"></i>
        </button>
        <button type="button" class="glass-pill-btn" id="refresh-dashboard">
            <i class="fa fa-sync" aria-hidden="true"></i>
            <span>Refresh</span>
        </button>
    </div>
</header>
