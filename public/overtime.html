<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" data-theme-color>
    <script src="/js/theme.js"></script>
    <title>Overtime | Human Resource</title>
    <link rel="icon" type="image/x-icon" href="/assets/img/hr_logo.png">

    <link rel="stylesheet" href="/css/source-sans-pro.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/vendor/adminlte.min.css">
    <link rel="stylesheet" href="/vendor/toastr/toastr.min.css">
    <link rel="stylesheet" href="/css/theme.css">

</head>
<body class="hold-transition sidebar-mini layout-fixed" data-page="overtime">
    <div class="wrapper">
        <div id="navbar-placeholder"></div>
        <div id="sidebar-placeholder"></div>

        <div class="content-wrapper">
            <section class="content">
                <div class="container-fluid">
                    <div class="content-header">
                        <div class="row mb-2">
                            <div class="col-sm-6">
                                <h1 class="m-0">Overtime</h1>
                            </div>
                            <div class="col-sm-6 text-right no-print">
                                <button type="button" class="btn btn-success" id="export-csv">
                                    <i class="fa fa-file-csv"></i> Export CSV
                                </button>
                                <button type="button" class="btn btn-primary" id="add-overtime">
                                    <i class="fa fa-plus"></i> Add Overtime
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Filters -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card card-glass no-print">
                                <div class="card-header">
                                    <h3 class="card-title">Filters</h3>
                                </div>
                                <div class="card-body">
                                    <form id="filter-form">
                                        <div class="row">
                                            <div class="form-group col-md-3">
                                                <label for="filter-from">From</label>
                                                <input type="date" class="form-control" id="filter-from">
                                            </div>
                                            <div class="form-group col-md-3">
                                                <label for="filter-to">To</label>
                                                <input type="date" class="form-control" id="filter-to">
                                            </div>
                                            <div class="form-group col-md-3">
                                                <label for="filter-student">Student</label>
                                                <select class="custom-select" id="filter-student">
                                                    <option value="">All students</option>
                                                </select>
                                            </div>
                                            <div class="form-group col-md-3">
                                                <label for="filter-department">Department</label>
                                                <select class="custom-select" id="filter-department">
                                                    <option value="">All departments</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-12">
                                                <button class="btn btn-primary mr-2" type="submit">Filter</button>
                                                <button class="btn btn-success" type="reset" id="reset-filters">Reset</button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Entries -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card card-glass">
                                <div class="card-header">
                                    <h3 class="card-title">Overtime entries</h3>
                                </div>
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-striped">
                                            <thead>
                                                <tr>
                                                    <th>Student</th>
                                                    <th>Department</th>
                                                    <th>Date</th>
                                                    <th class="text-center">Hours</th>
                                                    <th>Note</th>
                                                    <th class="no-print">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody id="overtime-body">
                                                <tr><td colspan="6" class="text-center py-4">Loading…</td></tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="card-footer d-flex justify-content-between align-items-center">
                                    <span class="text-muted" id="overtime-count"></span>
                                    <div id="overtime-pagination"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Monthly summary -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card card-glass">
                                <div class="card-header">
                                    <h3 class="card-title">Monthly summary</h3>
                                    <div class="card-tools no-print">
                                        <button type="button" class="btn btn-sm btn-success" id="export-summary">
                                            <i class="fa fa-file-csv"></i> Export
                                        </button>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="form-group col-md-3">
                                            <label for="summary-month">Month</label>
                                            <input type="month" class="form-control" id="summary-month">
                                        </div>
                                        <div class="form-group col-md-3">
                                            <label for="summary-department">Department</label>
                                            <select class="custom-select" id="summary-department">
                                                <option value="">All departments</option>
                                            </select>
                                        </div>
                                        <div class="form-group col-md-3 d-flex align-items-end">
                                            <button type="button" class="btn btn-primary" id="load-summary">Load the summary</button>
                                        </div>
                                    </div>
                                    <div class="table-responsive">
                                        <table class="table table-striped mb-0">
                                            <thead>
                                                <tr>
                                                    <th>Student</th>
                                                    <th>Department</th>
                                                    <th class="text-center">Entries</th>
                                                    <th class="text-right">Total hours</th>
                                                </tr>
                                            </thead>
                                            <tbody id="summary-body">
                                                <tr><td colspan="4" class="text-center py-4">Pick a month and load the summary.</td></tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="card-footer">
                                    <span class="text-muted" id="summary-total"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="main-footer">
            <strong>Human Resource</strong> — Lean HRM
            <div class="float-right d-none d-sm-inline">Signed in as <span data-admin-name>Administrator</span></div>
        </footer>
    </div>

    <!-- Add / edit overtime -->
    <div class="modal fade" id="overtime-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="overtime-modal-title">Add overtime</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form id="overtime-form">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="overtime-student">Student</label>
                            <select class="custom-select" id="overtime-student" name="studentId" required>
                                <option value="">Choose a student</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="form-group col-6">
                                <label for="overtime-date">Date</label>
                                <input type="date" class="form-control" id="overtime-date" name="date" required>
                            </div>
                            <div class="form-group col-6">
                                <label for="overtime-hours">Hours</label>
                                <input type="number" class="form-control" id="overtime-hours" name="hours"
                                       min="0.25" max="24" step="0.25" required>
                                <small class="form-text text-muted">0.25 to 24, in quarter-hour steps.</small>
                            </div>
                        </div>
                        <div class="form-group mb-0">
                            <label for="overtime-note">Note <small class="text-muted">(optional)</small></label>
                            <textarea class="form-control" id="overtime-note" name="note" rows="3" maxlength="500"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="overtime-save">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/vendor/jquery.min.js"></script>
    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/vendor/toastr/toastr.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/dom.js"></script>
    <script src="/js/fullscreen.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/overtime.js"></script>
</body>
</html>
