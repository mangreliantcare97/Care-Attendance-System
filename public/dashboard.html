<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" data-theme-color>
    <script src="/js/theme.js"></script>
    <title>Dashboard | Care Attendance</title>
    <link rel="icon" type="image/x-icon" href="/assets/img/hr_logo.png">

    <link rel="stylesheet" href="/css/source-sans-pro.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/vendor/adminlte.min.css">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed" data-page="dashboard">
    <div class="wrapper">
        <div id="navbar-placeholder"></div>
        <div id="sidebar-placeholder"></div>

        <div class="content-wrapper">
            <section class="content">
                <div class="container-fluid">
                    <div class="content-header">
                        <div class="row mb-2">
                            <div class="col-12">
                                <h1 class="m-0">Dashboard</h1>
                            </div>
                        </div>
                    </div>

                    <div class="row" id="no-locations-warning" hidden>
                        <div class="col-12">
                            <div class="card card-glass border-warning">
                                <div class="card-body d-flex flex-wrap align-items-center justify-content-between">
                                    <div>
                                        <h5 class="mb-1"><i class="fas fa-exclamation-triangle mr-1" aria-hidden="true"></i>No active locations</h5>
                                        <p class="mb-0">The public check-in form cannot be used until at least one location is active.</p>
                                    </div>
                                    <a href="/locations.html" class="btn btn-outline-primary mt-2">Open Locations</a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12">
                            <div class="card card-glass">
                                <div class="card-header">
                                    <h3 class="card-title">Public check-in link</h3>
                                </div>
                                <div class="card-body">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="public-link" readonly aria-label="Public check-in link">
                                        <div class="input-group-append">
                                            <button type="button" class="btn btn-outline-primary" id="copy-public-link"><i class="fas fa-copy mr-1" aria-hidden="true"></i>Copy</button>
                                            <a class="btn btn-primary" id="open-public-link" href="/" target="_blank" rel="noopener"><i class="fas fa-external-link-alt mr-1" aria-hidden="true"></i>Open</a>
                                        </div>
                                    </div>
                                    <p class="mb-0 mt-2 small text-muted" id="public-link-status" role="status" aria-live="polite"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-3">
                        <div class="col-12">
                            <div class="card card-glass">
                                <div class="card-body">
                                    <p class="mb-0">Coming in Phase 2</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="main-footer">
            <strong>Care Attendance</strong>
            <div class="float-right d-none d-sm-inline">Signed in as <span data-admin-name>Administrator</span></div>
        </footer>
    </div>

    <script src="/vendor/jquery.min.js"></script>
    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/fullscreen.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/clipboard.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
