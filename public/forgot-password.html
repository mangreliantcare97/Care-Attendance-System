<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" data-theme-color>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Care Attendance">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/pwa/apple-touch-icon.png">
    <script src="/js/theme.js"></script>
    <title>Forgot password | Care Attendance</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/img/pwa/favicon-48.png">

    <link rel="stylesheet" href="/css/source-sans-pro.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/vendor/adminlte.min.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/pwa.css">
    <script src="/js/pwa.js" defer></script>

    <style>
        body.login-page {
            background: none;
        }

        .login-page::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url('/assets/img/bc4.jpg') no-repeat center center fixed;
            background-size: cover;
            filter: blur(8px);
            z-index: -1;
        }

        .login-box {
            position: relative;
            z-index: 1;
            background: var(--hrm-surface-raised);
            border-radius: 8px;
        }

        [data-theme='dark'] .login-page::before {
            filter: blur(8px) brightness(0.5);
        }
    </style>
</head>
<body class="hold-transition login-page">
    <div class="login-box">
        <div class="login-logo">
            <a href="/login.html"><b>Care</b> Attendance</a>
        </div>

        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Reset your administrator password</p>

                <div id="forgot-alert" class="alert d-none" role="alert"></div>

                <form id="forgot-form" novalidate>
                    <div class="input-group mb-3">
                        <input type="email" name="email" id="forgot-email" class="form-control" placeholder="Email"
                               autocomplete="username" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-envelope"></span>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-8">
                            <a href="/login.html" class="text-center d-block mt-2">&larr; Back to the sign in</a>
                        </div>
                        <div class="col-4">
                            <button type="submit" id="forgot-submit" class="btn btn-primary btn-block">Send</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/vendor/jquery.min.js"></script>
    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/forgot-password.js"></script>
</body>
</html>
