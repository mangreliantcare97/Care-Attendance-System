<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" data-theme-color>
    <script src="/js/theme.js"></script>
    <title>Reset password | Human Resource</title>
    <link rel="icon" type="image/x-icon" href="/assets/img/hr_logo.png">

    <!-- The token must never leave this page through the referrer. -->
    <meta name="referrer" content="no-referrer">

    <link rel="stylesheet" href="/css/source-sans-pro.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/vendor/adminlte.min.css">
    <link rel="stylesheet" href="/css/theme.css">

    <style>
        body.login-page {
            background: none;
        }

        .login-page::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url('/assets/img/bc4.jpg') no-repeat center center fixed;
            background-size: cover;
            filter: blur(8px);
            z-index: -1;
        }

        .login-box {
            position: relative;
            z-index: 1;
            background: var(--hrm-surface-raised);
            border-radius: 8px;
        }

        [data-theme='dark'] .login-page::before {
            filter: blur(8px) brightness(0.5);
        }
    </style>
</head>
<body class="hold-transition login-page">
    <div class="login-box">
        <div class="login-logo">
            <a href="/login.html"><b>Human</b>Resource</a>
        </div>

        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Choose a new password</p>

                <div id="reset-alert" class="alert d-none" role="alert"></div>

                <form id="reset-form" novalidate>
                    <div class="input-group mb-3">
                        <input type="password" name="password" id="reset-password" class="form-control"
                               placeholder="New password" autocomplete="new-password" minlength="8" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>

                    <div class="input-group mb-3">
                        <input type="password" name="confirmation" id="reset-confirmation" class="form-control"
                               placeholder="Repeat the password" autocomplete="new-password" minlength="8" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-8">
                            <a href="/login.html" class="text-center d-block mt-2">&larr; Back to the sign in</a>
                        </div>
                        <div class="col-4">
                            <button type="submit" id="reset-submit" class="btn btn-primary btn-block">Save</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/vendor/jquery.min.js"></script>
    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/reset-password.js"></script>
</body>
</html>
