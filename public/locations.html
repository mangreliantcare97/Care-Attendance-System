<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" data-theme-color>
    <script src="/js/theme.js"></script>
    <title>Locations | Care Attendance</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/care-attendance-mark.svg">

    <link rel="stylesheet" href="/css/source-sans-pro.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/vendor/adminlte.min.css">
    <link rel="stylesheet" href="/vendor/toastr/toastr.min.css">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed page-locations" data-page="locations">
    <div class="wrapper">
        <div id="navbar-placeholder"></div>
        <div id="sidebar-placeholder"></div>

        <div class="content-wrapper">
            <section class="content">
                <div class="container-fluid">
                    <div class="content-header">
                        <div class="row mb-2">
                            <div class="col-sm-6">
                                <h1 class="m-0">Locations</h1>
                                <small class="text-muted">Active locations appear on the public check-in form.</small>
                            </div>
                            <div class="col-sm-6 text-right no-print">
                                <button type="button" class="btn btn-primary" id="add-location">
                                    <i class="fa fa-plus" aria-hidden="true"></i> Add Location
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12">
                            <div class="card card-glass">
                                <div class="card-header">
                                    <div class="row w-100 align-items-center">
                                        <div class="col-md-6">
                                            <h3 class="card-title mb-md-1">Check-in locations</h3>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-inline justify-content-md-end location-toolbar">
                                                <label class="sr-only" for="location-search">Search locations</label>
                                                <input type="search" class="form-control form-control-sm mr-2"
                                                       id="location-search" placeholder="Search name or postcode"
                                                       autocomplete="off">
                                                <button type="button" class="btn btn-sm btn-outline-primary mr-2"
                                                        id="sort-az" title="Sort the list from A to Z">
                                                    <i class="fa fa-sort-alpha-down" aria-hidden="true"></i> Sort A-Z
                                                </button>
                                                <button type="button" class="btn btn-sm btn-outline-secondary"
                                                        id="refresh-locations" title="Reload the list">
                                                    <i class="fa fa-sync" aria-hidden="true"></i> Refresh
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-striped mb-0">
                                            <thead>
                                                <tr>
                                                    <th scope="col">
                                                        <button type="button" class="admin-sort" data-sort="name">
                                                            Name <i class="fa fa-sort" aria-hidden="true"></i>
                                                        </button>
                                                    </th>
                                                    <th scope="col">
                                                        <button type="button" class="admin-sort" data-sort="postcode">
                                                            Postcode <i class="fa fa-sort" aria-hidden="true"></i>
                                                        </button>
                                                    </th>
                                                    <th scope="col">
                                                        <button type="button" class="admin-sort" data-sort="active">
                                                            Active <i class="fa fa-sort" aria-hidden="true"></i>
                                                        </button>
                                                    </th>
                                                    <th scope="col">
                                                        <button type="button" class="admin-sort" data-sort="entryCount">
                                                            Entries <i class="fa fa-sort" aria-hidden="true"></i>
                                                        </button>
                                                    </th>
                                                    <th scope="col" class="no-print">Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody id="locations-body">
                                                <tr><td colspan="5" class="text-center py-4">Loading…</td></tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                                <div class="card-footer">
                                    <span class="text-muted small" id="locations-summary"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="main-footer">
            <strong>Care Attendance</strong>
            <div class="float-right d-none d-sm-inline">Signed in as <span data-admin-name>Administrator</span></div>
        </footer>
    </div>

    <div class="modal fade" id="location-modal" tabindex="-1" aria-hidden="true" role="dialog"
         aria-labelledby="location-modal-title">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="location-modal-title">Add location</h2>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form id="location-form" novalidate>
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="location-name">Name <span class="admin-required">*</span></label>
                            <input type="text" class="form-control" id="location-name" name="name"
                                   required minlength="3" maxlength="160" autocomplete="off"
                                   placeholder="33 Chandos Road, Harrow, HA1 4QX">
                        </div>
                        <div class="form-group">
                            <label for="location-postcode">Postcode <span class="admin-required">*</span></label>
                            <input type="text" class="form-control" id="location-postcode" name="postcode"
                                   required maxlength="9" autocomplete="off" spellcheck="false"
                                   placeholder="HA1 4QX">
                        </div>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="location-active" name="active" checked>
                            <label class="form-check-label" for="location-active">
                                Active — show this location on the public check-in form
                            </label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="location-save">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/vendor/jquery.min.js"></script>
    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/vendor/toastr/toastr.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/dom.js"></script>
    <script src="/js/clipboard.js"></script>
    <script src="/js/fullscreen.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/locations.js"></script>
</body>
</html>
