<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" data-theme-color>
    <script src="/js/theme.js"></script>
    <title>Sign in | Care Attendance</title>
    <link rel="icon" type="image/x-icon" href="/assets/img/hr_logo.png">

    <link rel="stylesheet" href="/css/source-sans-pro.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/vendor/adminlte.min.css">
    <link rel="stylesheet" href="/css/theme.css">

    <style>
        /* The blurred photo behind the login card (kept in the theme so that
           the print stylesheet and dark mode stay in one place). */
        body.login-page {
            background: none;
        }

        .login-page::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url('/assets/img/bc4.jpg') no-repeat center center fixed;
            background-size: cover;
            filter: blur(8px);
            z-index: -1;
        }

        .login-box {
            position: relative;
            z-index: 1;
            background: var(--hrm-surface-raised);
            border-radius: 8px;
        }

        [data-theme='dark'] .login-page::before {
            filter: blur(8px) brightness(0.5);
        }
    </style>
</head>
<body class="hold-transition login-page">
    <div class="login-box">
        <div class="login-logo">
            <a href="/login.html"><b>Care</b> Attendance</a>
        </div>

        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Sign in to start your session</p>

                <div id="login-alert" class="alert d-none" role="alert"></div>

                <form id="login-form" novalidate>
                    <div class="input-group mb-3">
                        <input type="email" name="email" id="login-email" class="form-control" placeholder="Email" autocomplete="username" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-envelope"></span>
                            </div>
                        </div>
                    </div>

                    <div class="input-group mb-3">
                        <input type="password" name="password" id="login-password" class="form-control" placeholder="Password" autocomplete="current-password" required>
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-8">
                            <div class="icheck-primary">
                                <a href="/forgot-password.html" class="text-center d-block mt-2">Forgot password?</a>
                            </div>
                        </div>
                        <div class="col-4">
                            <button type="submit" id="login-submit" class="btn btn-primary btn-block">Sign In</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/vendor/jquery.min.js"></script>
    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
