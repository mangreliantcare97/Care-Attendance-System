<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" data-theme-color>
    <script src="/js/theme.js"></script>
    <title>Entries | Care Attendance</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/care-attendance-mark.svg">

    <link rel="stylesheet" href="/css/source-sans-pro.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/vendor/adminlte.min.css">
    <link rel="stylesheet" href="/vendor/toastr/toastr.min.css">
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed page-entries" data-page="entries">
    <div class="wrapper">
        <div id="navbar-placeholder"></div>
        <div id="sidebar-placeholder"></div>

        <div class="content-wrapper">
            <section class="content">
                <div class="container-fluid">
                    <div class="content-header">
                        <div class="row mb-2 align-items-center">
                            <div class="col-md-8">
                                <h1 class="m-0">Entries</h1>
                                <small class="text-muted">Review, correct and export check-in records.</small>
                            </div>
                            <div class="col-md-4 text-md-right mt-2 mt-md-0">
                                <button type="button" class="btn btn-outline-primary" id="export-entries">
                                    <i class="fa fa-download mr-1" aria-hidden="true"></i> Export CSV
                                </button>
                                <button type="button" class="btn btn-outline-secondary" id="refresh-entries">
                                    <i class="fa fa-sync mr-1" aria-hidden="true"></i> Refresh
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="card card-glass">
                        <div class="card-header">
                            <h2 class="card-title h5 mb-0">Filter entries</h2>
                        </div>
                        <div class="card-body">
                            <form id="entry-filter-form">
                                <div class="form-row">
                                    <div class="form-group col-lg-3 col-md-6">
                                        <label for="entry-search">Name</label>
                                        <input type="search" class="form-control" id="entry-search" name="search"
                                               maxlength="120" autocomplete="off" placeholder="Search a name">
                                    </div>
                                    <div class="form-group col-lg-2 col-md-6">
                                        <label for="entry-user-type">User type</label>
                                        <select class="form-control" id="entry-user-type" name="userType">
                                            <option value="">All types</option>
                                            <option value="staff">Staff Member</option>
                                            <option value="service_user">Service User</option>
                                            <option value="visitor">Visitor</option>
                                        </select>
                                    </div>
                                    <div class="form-group col-lg-2 col-md-6">
                                        <label for="entry-direction">Direction</label>
                                        <select class="form-control" id="entry-direction" name="direction">
                                            <option value="">All directions</option>
                                            <option value="in">Check in</option>
                                            <option value="out">Check out</option>
                                        </select>
                                    </div>
                                    <div class="form-group col-lg-2 col-md-6">
                                        <label for="entry-location">Location</label>
                                        <select class="form-control" id="entry-location" name="locationId">
                                            <option value="">All locations</option>
                                        </select>
                                    </div>
                                    <div class="form-group col-lg-1 col-md-6">
                                        <label for="entry-date-from">From</label>
                                        <input type="date" class="form-control" id="entry-date-from" name="dateFrom">
                                    </div>
                                    <div class="form-group col-lg-1 col-md-6">
                                        <label for="entry-date-to">To</label>
                                        <input type="date" class="form-control" id="entry-date-to" name="dateTo">
                                    </div>
                                    <div class="form-group col-lg-1 col-md-6 d-flex align-items-end">
                                        <button type="submit" class="btn btn-primary btn-block" id="apply-entry-filters">
                                            <i class="fa fa-search" aria-hidden="true"></i><span class="sr-only">Apply filters</span>
                                        </button>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-sm btn-link px-0" id="reset-entry-filters">Reset filters</button>
                            </form>
                        </div>
                    </div>

                    <div class="card card-glass">
                        <div class="card-header d-flex flex-wrap justify-content-between align-items-center">
                            <h2 class="card-title h5 mb-0">Check-in records</h2>
                            <label class="mb-0 small">
                                Rows per page
                                <select class="form-control form-control-sm d-inline-block ml-1 entry-per-page-select" id="entry-per-page" aria-label="Rows per page">
                                    <option value="20">20</option>
                                    <option value="50">50</option>
                                    <option value="100">100</option>
                                </select>
                            </label>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover mb-0" aria-describedby="entries-summary">
                                    <thead>
                                        <tr>
                                            <th scope="col"><button type="button" class="admin-sort" data-sort="date">Date <i class="fa fa-sort-down" aria-hidden="true"></i></button></th>
                                            <th scope="col"><button type="button" class="admin-sort" data-sort="time">Time <i class="fa fa-sort" aria-hidden="true"></i></button></th>
                                            <th scope="col"><button type="button" class="admin-sort" data-sort="name">Name <i class="fa fa-sort" aria-hidden="true"></i></button></th>
                                            <th scope="col"><button type="button" class="admin-sort" data-sort="userType">User type <i class="fa fa-sort" aria-hidden="true"></i></button></th>
                                            <th scope="col"><button type="button" class="admin-sort" data-sort="direction">Direction <i class="fa fa-sort" aria-hidden="true"></i></button></th>
                                            <th scope="col"><button type="button" class="admin-sort" data-sort="location">Location <i class="fa fa-sort" aria-hidden="true"></i></button></th>
                                            <th scope="col">Notes</th>
                                            <th scope="col" class="text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="entries-body">
                                        <tr><td colspan="8" class="text-center py-4">Loading entries…</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="card-footer d-flex flex-wrap justify-content-between align-items-center">
                            <span class="text-muted small" id="entries-summary" aria-live="polite">Loading entries…</span>
                            <nav aria-label="Entry pages" class="mt-2 mt-sm-0">
                                <div class="btn-group btn-group-sm" role="group">
                                    <button type="button" class="btn btn-outline-secondary" id="entries-previous" aria-label="Previous page">Previous</button>
                                    <span class="btn btn-outline-secondary disabled" id="entries-page-status" aria-live="polite">Page 1 of 1</span>
                                    <button type="button" class="btn btn-outline-secondary" id="entries-next" aria-label="Next page">Next</button>
                                </div>
                            </nav>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="main-footer">
            <strong>Care Attendance</strong>
            <div class="float-right d-none d-sm-inline">Signed in as <span data-admin-name>Administrator</span></div>
        </footer>
    </div>

    <div class="modal fade" id="entry-modal" tabindex="-1" aria-hidden="true" role="dialog"
         aria-labelledby="entry-modal-title">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="entry-modal-title">Edit entry</h2>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form id="entry-form" novalidate>
                    <div class="modal-body">
                        <div class="form-row">
                            <div class="form-group col-md-6">
                                <label for="edit-entry-name">Name</label>
                                <input type="text" class="form-control" id="edit-entry-name" name="name" required minlength="2" maxlength="80">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="edit-entry-user-type">User type</label>
                                <select class="form-control" id="edit-entry-user-type" name="userType" required>
                                    <option value="staff">Staff Member</option>
                                    <option value="service_user">Service User</option>
                                    <option value="visitor">Visitor</option>
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="edit-entry-direction">Direction</label>
                                <select class="form-control" id="edit-entry-direction" name="direction" required>
                                    <option value="in">Check in</option>
                                    <option value="out">Check out</option>
                                </select>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="edit-entry-date">Date</label>
                                <input type="date" class="form-control" id="edit-entry-date" name="date" required>
                            </div>
                            <div class="form-group col-md-4">
                                <label for="edit-entry-time">Entered time</label>
                                <input type="time" class="form-control" id="edit-entry-time" name="enteredTime" required>
                            </div>
                            <div class="form-group col-12">
                                <label for="edit-entry-location">Location</label>
                                <select class="form-control" id="edit-entry-location" name="locationId" required></select>
                            </div>
                            <div class="form-group col-12">
                                <label for="edit-entry-notes">Notes</label>
                                <textarea class="form-control" id="edit-entry-notes" name="notes" rows="3" required maxlength="500"></textarea>
                            </div>
                        </div>
                        <p class="small text-muted mb-0">The original received timestamp is retained for the audit record.</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="save-entry">Save changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/vendor/jquery.min.js"></script>
    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/vendor/toastr/toastr.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/dom.js"></script>
    <script src="/js/fullscreen.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/entries.js"></script>
</body>
</html>
